    <h1 style="text-align: center;">Music Room</h1>
    <p style="text-align: center;">Pick your choice of ambience sound to listen to while you read.</p>
    
    <p style="text-align: center;">
	<img width="250" src="image/gramophome.jpg" alt="Gramophome Photo">
	</p>
    
    <p style="text-align: center;">Click the buttons to play or pause the audio.</p>

<!--Buttons to play and pause forest audio-->

    <div style="text-align: center;">
    <button onclick="playAudio_forest()" type="button">Play Forest Audio</button>
    <button onclick="pauseAudio_forest()" type="button">Pause Forest Audio</button> 
    </div>
    
    <p></p>
    
<!--Buttons to play and pause cafe audio-->
    
    <div style="text-align: center;">
    <button onclick="playAudio_cafe()" type="button">Play Cafe Audio</button>
    <button onclick="pauseAudio_cafe()" type="button">Pause Cafe Audio</button>
    </div>

    <p></p>

<!--Buttons to play and pause fireplace audio-->

    <div style="text-align: center;">
    <button onclick="playAudio_fireplace()" type="button">Play Fireplace Audio</button>
    <button onclick="pauseAudio_fireplace()" type="button">Pause Fireplace Audio</button>
    </div>

    <p></p>
    
<!--Script for play and pause audio buttons-->
<!--Audio will loop until paused-->

<script>
var x = document.getElementById("myAudio_forest"); 
var y = document.getElementById("myAudio_cafe"); 
var z = document.getElementById("myAudio_fireplace"); 

function playAudio_forest() { 
  x.loop = true;
  x.load();
  x.play();
} 

function pauseAudio_forest() { 
  x.pause(); 
} 

function playAudio_cafe() { 
  y.loop = true;
  y.load();
  y.play();
} 

function pauseAudio_cafe() { 
  y.pause(); 
} 

function playAudio_fireplace() { 
  z.loop = true;
  z.load();
  z.play();
} 

function pauseAudio_fireplace() { 
  z.pause(); 
} 

</script>  
    
</body>
